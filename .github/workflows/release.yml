# 推送 `v*` tag 时构建并发布 Release，附件为 `bun pm pack` 产出的 tgz。
# 消费方可直接 `bun add <tgz 附件地址>` 安装，无需 npm 仓库，见 README「从 GitHub 安装」。
# 手动触发（workflow_dispatch）时按 package.json 的 version 推导 tag。

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: pkg
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Resolve release tag
        id: rel
        run: |
          VERSION='${{ steps.pkg.outputs.version }}'
          if [ "${{ github.ref_type }}" = "tag" ]; then
            # tag 与 package.json 不一致时附件名会和 tag 对不上，直接失败
            if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
              echo "tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}" >&2
              exit 1
            fi
            echo "tag_name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # bun:pack = build（含 lint + typecheck）+ bun pm pack，产出 canwdev-vgo-ui-<version>.tgz
      - name: Build and pack
        run: bun run bun:pack

      - name: Extract release notes from CHANGELOG
        run: bash .github/scripts/changelog-section.sh '${{ steps.pkg.outputs.version }}'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag_name }}
          name: ${{ steps.rel.outputs.tag_name }}
          # 正文优先用 CHANGELOG 小节，抠不到才回退到自动生成
          body_path: ${{ hashFiles('RELEASE_NOTES.md') != '' && 'RELEASE_NOTES.md' || '' }}
          generate_release_notes: ${{ hashFiles('RELEASE_NOTES.md') == '' }}
          files: '*.tgz'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
